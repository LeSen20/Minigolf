<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minigolf</title>
<style>
  :root{--navy:#26323F;--card:#fff;--green:#61CB8B;--sand:#EB9268;--red:#D3554E;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS","Segoe UI",sans-serif;
    background:#8FD3F4;color:var(--navy);touch-action:none;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  .hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none;z-index:2;}
  .hud.top{top:0;align-items:flex-start;padding-top:calc(10px + env(safe-area-inset-top));}
  .pill{background:linear-gradient(180deg,#fff,#EFF6FB);border-radius:16px;padding:7px 12px;
    box-shadow:0 3px 0 rgba(38,50,63,.16),0 8px 18px rgba(38,50,63,.12);
    font-weight:800;font-size:13px;line-height:1.25;pointer-events:auto;}
  .pill small{display:block;font-weight:800;font-size:9px;color:#8098AC;letter-spacing:.07em;text-transform:uppercase;}

  #board{position:absolute;left:12px;top:calc(72px + env(safe-area-inset-top));z-index:2;
    background:rgba(255,255,255,.92);border-radius:13px;padding:5px 7px;font-size:11.5px;font-weight:800;
    box-shadow:0 3px 0 rgba(38,50,63,.12),0 8px 18px rgba(38,50,63,.14);min-width:112px;}
  .brow{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:7px;color:#5B7286;}
  .brow.act{background:rgba(97,203,139,.25);color:var(--navy);}
  .brow i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(38,50,63,.25);flex:0 0 auto;}
  .brow b{flex:1;font-weight:800;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brow span{font-variant-numeric:tabular-nums;font-weight:900;}

  #banner{position:absolute;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-6px);
    background:var(--navy);color:#fff;font-size:13px;font-weight:900;padding:7px 16px;border-radius:13px;z-index:5;
    box-shadow:0 6px 16px rgba(38,50,63,.35);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;}
  #banner.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hud.bottom{bottom:0;align-items:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
  #hint{background:rgba(38,50,63,.72);color:#fff;border-radius:14px;padding:8px 14px;font-size:12.5px;font-weight:800;
    pointer-events:none;transition:opacity .3s;}
  .rotBtn{width:46px;height:46px;border:none;border-radius:15px;background:linear-gradient(180deg,#fff,#E8F1F8);
    color:var(--navy);font-size:19px;font-weight:900;box-shadow:0 3px 0 rgba(38,50,63,.2);pointer-events:auto;}
  .rotBtn:active{transform:translateY(2px);}
  #rotRow{display:flex;gap:8px;pointer-events:auto;}

  #power{position:absolute;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(62vw,240px);height:13px;border-radius:8px;background:rgba(255,255,255,.85);z-index:3;
    box-shadow:0 3px 0 rgba(38,50,63,.18);overflow:hidden;display:none;}
  #powerFill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,#8FE0A6,#FFD34E 55%,#EE5B4C);}

  .overlay{position:absolute;inset:0;background:rgba(30,44,58,.45);backdrop-filter:blur(4px);z-index:10;
    display:none;align-items:center;justify-content:center;padding:20px;}
  .overlay.show{display:flex;}
  .card{background:linear-gradient(180deg,#fff,#F3F9FD);border-radius:26px;padding:24px 22px;width:100%;max-width:350px;
    box-shadow:0 9px 0 rgba(38,50,63,.2),0 28px 56px rgba(30,44,58,.45);text-align:center;max-height:88vh;overflow-y:auto;}
  .card h1{font-size:24px;font-weight:900;margin-bottom:6px;}
  .card h2{font-size:34px;font-weight:900;color:#2E9E6B;margin:4px 0;}
  .card p{font-size:13.5px;font-weight:700;color:#63798C;line-height:1.55;margin-bottom:10px;}
  .card table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-weight:800;font-size:13px;}
  .card td,.card th{padding:6px 3px;border-bottom:2px solid #E9F1F7;text-align:center;}
  .card td.nm{text-align:left;display:flex;align-items:center;gap:6px;}
  .card td.nm i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(38,50,63,.25);}
  .card th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8098AC;}
  tr.me td{background:rgba(97,203,139,.16);}
  .setLbl{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8098AC;margin:14px 0 7px;}
  .chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  .chip{background:#EAF3FA;border:none;border-radius:13px;padding:9px 14px;font:inherit;font-weight:800;font-size:13px;
    color:var(--navy);box-shadow:0 3px 0 rgba(38,50,63,.14);}
  .chip.on{background:linear-gradient(180deg,#7ADCA3,#3FAE74);color:#fff;box-shadow:0 3px 0 #2C8557;}
  .bigbtn{background:linear-gradient(180deg,#7ADCA3,#3FAE74);color:#fff;border:none;border-radius:17px;
    font:inherit;font-weight:900;font-size:17px;padding:13px 32px;margin-top:14px;text-shadow:0 2px 0 rgba(0,0,0,.14);
    box-shadow:0 5px 0 #2C8557,0 12px 24px rgba(63,174,116,.4);}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2C8557;}
  .modeRow{display:flex;gap:9px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap;}
  .modeBtn{flex:1 1 130px;max-width:170px;border:none;cursor:pointer;border-radius:14px;
    padding:10px 8px;font:700 13.5px/1.25 inherit;color:#41525F;background:#D6E6F2;
    box-shadow:inset 0 -3px 0 rgba(38,50,63,.13);transition:background .15s,color .15s;}
  .modeBtn small{display:block;font-weight:700;font-size:10.5px;opacity:.72;margin-top:2px;}
  .modeBtn.sel{background:#61CB8B;color:#17321F;box-shadow:inset 0 -3px 0 rgba(20,50,30,.22);}
  .nameIn{width:100%;max-width:220px;border:none;border-radius:13px;padding:10px 14px;
    font:inherit;font-weight:800;font-size:14px;text-align:center;color:var(--navy);
    background:#EAF3FA;box-shadow:inset 0 2px 0 rgba(38,50,63,.10);outline:none;}
  .nameIn:focus{background:#E1EEF8;box-shadow:inset 0 2px 0 rgba(38,50,63,.10),0 0 0 3px rgba(97,203,139,.45);}
  .board{margin-top:6px;}
  .board h3{font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
    color:#8098AC;margin:14px 0 6px;}
  .netmsg{font-size:11px;font-weight:700;color:#9DB0C0;margin-top:6px;}
  .rec{font-size:10.5px;font-weight:800;color:#8098AC;margin-top:2px;}
  .credit{margin-top:12px;font-size:10.5px;color:#9DB0C0;font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <div class="hud top">
    <div class="pill"><small id="holeSub">Bahn 1</small><span id="parInfo">Par 2</span></div>
    <div class="pill"><small id="whoInfo">Du</small><span id="strokeInfo">0 Schläge</span></div>
    <div class="pill"><small>Gesamt</small><span id="totInfo">E</span></div>
  </div>
  <div id="board"></div>
  <div id="banner"></div>
  <div class="hud bottom">
    <div id="hint">Ball antippen und nach hinten ziehen</div>
    <div id="rotRow"><button class="rotBtn" id="sndBtn">♪</button><button class="rotBtn" id="rotL">⟲</button><button class="rotBtn" id="rotR">⟳</button></div>
  </div>
  <div id="power"><div id="powerFill"></div></div>

  <div class="overlay show" id="startOv"><div class="card">
    <h1>⛳ Minigolf</h1>
    <div class="setLbl">Dein Name</div>
    <input id="nameIn" class="nameIn" maxlength="14" placeholder="Spieler" autocomplete="off">
    <div class="setLbl">Gegner</div><div class="chips" id="chipsN"></div>
    <div class="setLbl">Spielstärke</div><div class="chips" id="chipsD"></div>
    <div class="modeRow">
      <button class="modeBtn sel" id="modeGolf">Minigolf<small>12 Bahnen</small></button>
      <button class="modeBtn" id="modeMarble">Murmelbahn<small>233 Kacheln, 3 Ebenen</small></button>
    </div>
    <button class="bigbtn" id="startBtn">Losspielen</button>
    <div class="credit">3D-Modelle &amp; Umgebung: Kenney (CC0) · kenney.nl</div>
  </div></div>

  <div class="overlay" id="holeOv"><div class="card">
    <h1 id="holeOvTitle">Bahn 1</h1>
    <table id="holeTable"></table>
    <div class="rec" id="holeRec"></div>
    <button class="bigbtn" id="nextBtn">Weiter</button>
  </div></div>

  <div class="overlay" id="endOv"><div class="card">
    <h1 id="endTitle">🏆 Fertig</h1>
    <h2 id="endScore"></h2><p id="endSub"></p>
    <table id="scoreTable"></table>
    <div class="board"><h3>Weltbestenliste</h3>
      <table id="worldTable"></table>
      <div class="netmsg" id="netMsg"></div></div>
    <button class="bigbtn" onclick="location.reload()">Neue Runde</button>
    <div class="credit">3D-Modelle &amp; Umgebung: Kenney (CC0) · kenney.nl</div>
  </div></div>
</div>

function b64(s,Type){
  const bin=atob(s),n=bin.length,u=new Uint8Array(n);
  for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return new Type(u.buffer,0,n/Type.BYTES_PER_ELEMENT);
}
const PAL=MODELDATA.pal.map(h=>{
  const c=new THREE.Color("#"+h); c.convertSRGBToLinear(); return c;
});
const GEO={};
for(const name in MODELDATA.m){
  const m=MODELDATA.m[name];
  const P=b64(m.p,Int16Array),N=b64(m.n,Int8Array),C=b64(m.c,Uint8Array),I=b64(m.i,Uint16Array);
  const pos=new Float32Array(P.length),nor=new Float32Array(N.length),col=new Float32Array(C.length*3);
  for(let i=0;i<P.length;i++)pos[i]=P[i]/MODELDATA.s;
  for(let i=0;i<N.length;i++)nor[i]=N[i]/127;
  for(let i=0;i<C.length;i++){const c=PAL[C[i]];col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("normal",new THREE.BufferAttribute(nor,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(I),1));
  GEO[name]=g;
}

/* ── Himmelskuppel mit weichem Verlauf ─────────────────────── */
(function(){
  const g=new THREE.SphereGeometry(300,24,16),cols=[];
  const top=new THREE.Color(0x4A97DC).convertSRGBToLinear();
  const mid=new THREE.Color(0x9FD4F2).convertSRGBToLinear();
  const low=new THREE.Color(0xF6ECD6).convertSRGBToLinear();
  const pos=g.attributes.position,tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const t=Math.max(0,Math.min(1,pos.getY(i)/300*.5+.5));
    if(t>.55)tmp.copy(mid).lerp(top,(t-.55)/.45); else tmp.copy(low).lerp(mid,t/.55);
    cols.push(tmp.r,tmp.g,tmp.b);
  }
  g.setAttribute("color",new THREE.Float32BufferAttribute(cols,3));
  scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial(
    {vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false})));
})();

/* Die Vorlagen sind isometrisch aus rund 36° Höhe gerendert, die Kamera sieht
   die Kulisse aber nur aus etwa 6°. Ein Kippen der Karte hilft kaum – bei 29°
   bleibt sie noch zu 92 % frontal sichtbar. Bodennahe Objekte werden deshalb
   zusätzlich in den Boden versenkt: Ohne sichtbare Standlinie liest sich der
   Rest als Findling im Gras statt als aufgestellte Scheibe.
   sink = Anteil der Höhe unter dem Boden, tilt = Neigung nach hinten. */
/* Als Sprite taugen nur hohe, um die Senkrechte etwa symmetrische Objekte.
   Bei flachen Dingen verläuft die gezeichnete Unterkante isometrisch um 19°
   schräg – aufrecht hingestellt sitzt so ein Bild zwangsläufig wie auf einer
   Rampe, und weder Kippen noch Versenken behebt das. Steine entstehen deshalb
   weiter unten als echte Geometrie. */
const SPRITE_STYLE={
  "tree":       {sink:.04},
  "tree-high":  {sink:.04},
  "plant":      {sink:.14},
};
/* Einheitshohe Karte mit passendem Atlasausschnitt; Fußpunkt je nach sink
   unter y=0, damit der Wiesenboden den unteren Teil verdeckt. */
function spriteGeo(key){
  const m=SPRITES[key],st=SPRITE_STYLE[key];
  const g=new THREE.PlaneGeometry(m.w/m.h,1);
  const uv=g.attributes.uv;
  uv.setXY(0,m.u0,1-m.v0); uv.setXY(1,m.u1,1-m.v0);
  uv.setXY(2,m.u0,1-m.v1); uv.setXY(3,m.u1,1-m.v1);
  uv.needsUpdate=true;
  g.translate(0,.5-st.sink,0);
  return g;
}
const scenery=new THREE.Group();scene.add(scenery);
const decals=new THREE.Group();scene.add(decals);
const INST={};                       /* key -> {mesh,x[],z[],s[],vis[]} */
/* Kulissengruppen aus echter Geometrie (Steine, Zelte) mit Position und
   Radius – damit sich einzelne Objekte ausblenden lassen, wenn die aktuelle
   Bahn unter ihnen hindurchführt. */
const SOLIDS=[];

(function(){
  let seed=20260721;
  const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const rng=(a,b)=>a+rnd()*(b-a);
  /* Kamera steht bis 8.0 vom Mittelpunkt entfernt -> stehender Bewuchs erst
     außerhalb dieser Ellipse. Flache Flecken dürfen näher heran. */
  const clear=(x,z)=>((x/9.4)**2+(z/10.8)**2)>=1;
  const clearFlat=(x,z)=>((x/6.6)**2+(z/8.2)**2)>=1;

  const plan={},taken=[];
  for(const k in SPRITE_STYLE)plan[k]={x:[],z:[],s:[]};
  const spaced=(x,z,r)=>{
    for(let i=0;i<taken.length;i++){
      const dx=taken[i][0]-x,dz=taken[i][1]-z;
      if(dx*dx+dz*dz<(r+taken[i][2])**2)return false;
    }
    return true;
  };
  function put(key,h,x,z,rad){
    const p=plan[key];p.x.push(x);p.z.push(z);p.s.push(h);
    taken.push([x,z,rad]);
  }
  /* areaEven: Radius so ziehen, dass die Dichte über die Fläche gleich bleibt
     (ohne das würde der Ring nach außen ausdünnen, weil die Fläche mit r² wächst) */
  function spot(rMin,rMax,rad,tries,areaEven){
    for(let t=0;t<(tries||60);t++){
      const a=rnd()*Math.PI*2;
      const d=areaEven?Math.sqrt(rMin*rMin+rnd()*(rMax*rMax-rMin*rMin)):rng(rMin,rMax);
      const x=Math.cos(a)*d,z=Math.sin(a)*d;
      if(clear(x,z)&&spaced(x,z,rad))return[x,z];
    }
    return null;
  }

  /* Reihenfolge: erst die raumgreifenden Elemente, danach der Wald als Füllung –
     sonst nimmt der dichte Baumbestand allem anderen den Platz weg. */
  /* 1) Zwei Lagerplätze */
  const tentSpots=[];
  for(let cI=0;cI<2;cI++){
    const c=spot(12.5,21,3.2);if(!c)continue;
    tentSpots.push([c[0],c[1],rnd()*6.283]);
    taken.push([c[0],c[1],1.3]);
    for(let k=0;k<4;k++){
      const b=rnd()*Math.PI*2,d=rng(1.5,2.8);
      const x=c[0]+Math.cos(b)*d,z=c[1]+Math.sin(b)*d;
      if(clear(x,z)&&spaced(x,z,.5))put("plant",rng(.7,1.0),x,z,.5);
    }
  }
  /* 2) Findlingsgruppen – echte Geometrie, siehe rockCluster() */
  const rockSpots=[];
  for(let gI=0;gI<16;gI++){
    const c=spot(10.5,30,2.4);if(!c)continue;
    const n=2+((rnd()*4)|0);
    for(let k=0;k<n;k++){
      const a=rnd()*Math.PI*2,d=rng(.5,1.9);
      const x=c[0]+Math.cos(a)*d,z=c[1]+Math.sin(a)*d;
      if(!clear(x,z)||!spaced(x,z,.6))continue;
      rockSpots.push([x,z,rng(.55,1.15),rnd()*6.283]);
      taken.push([x,z,.6]);
    }
  }
  /* 3) Pflanzensaum zur Bahn hin */
  for(let i=0;i<40;i++){
    const p=spot(9.8,14.5,.7);if(!p)continue;
    put("plant",rng(.65,1.0),p[0],p[1],.7);
  }
  /* 4) Wald füllt den Rest: außen geschlossen, nach innen auslichtend */
  for(let i=0;i<520;i++){
    const p=spot(15.5,38,.70,70,true);if(!p)continue;
    put(rnd()<.45?"tree-high":"tree",rng(3.2,4.9),p[0],p[1],.70);
  }
  for(let i=0;i<110;i++){
    const p=spot(10.8,16,.92,70,true);if(!p)continue;
    put(rnd()<.5?"tree-high":"tree",rng(2.5,3.7),p[0],p[1],.92);
  }

  /* Findlinge als echte Geometrie: sechseckige Säulen, wie sie das Vorbild
     zeigt. Farben aus rocks-low/high/ramp entnommen; die Schattierung
     übernimmt das Szenenlicht, deshalb reicht ein Grundton je Säule. */
  /* Achtung: Die Farben im PNG sind bereits schattiert – #484878 ist dort eine
     abgewandte Seitenfläche. Als Grundfarbe genommen und nochmal beleuchtet
     ergäbe das #2F355C, also fast Schwarz. Deshalb hellere Grundtöne, aus
     denen das Szenenlicht die Vorlagenwerte erst erzeugt. */
  const ROCKCOL=["#A2A2BE","#9C9CB8","#A8A8C4","#9696B2","#ABABC6"]
    .map(h=>{const c=new THREE.Color(h);c.convertSRGBToLinear();return c;});
  function rockCluster(){
    const parts=[],n=3+((rnd()*4)|0);
    for(let i=0;i<n;i++){
      const r=rng(.16,.40),h=rng(.22,.92);
      const g=new THREE.CylinderGeometry(r*rng(.72,1),r,h,6);
      g.rotateY(rnd()*Math.PI);
      g.translate(rng(-.42,.42),h/2,rng(-.42,.42));
      const c=ROCKCOL[(rnd()*ROCKCOL.length)|0];
      const cnt=g.attributes.position.count,col=new Float32Array(cnt*3);
      for(let k=0;k<cnt;k++){col[k*3]=c.r;col[k*3+1]=c.g;col[k*3+2]=c.b;}
      g.setAttribute("color",new THREE.BufferAttribute(col,3));
      parts.push(g);
    }
    return mergeGeoms(parts);
  }
  if(rockSpots.length){
    const protos=[];for(let i=0;i<6;i++)protos.push(rockCluster());
    const buckets=protos.map(()=>[]);
    rockSpots.forEach((sp,i)=>buckets[i%protos.length].push(sp));
    const rockMat=new THREE.MeshLambertMaterial({vertexColors:true});
    const RM=new THREE.Matrix4(),RQ=new THREE.Quaternion(),RV=new THREE.Vector3(),RS=new THREE.Vector3();
    protos.forEach((geo,pi)=>{
      const list=buckets[pi];if(!list.length)return;
      const im=new THREE.InstancedMesh(geo,rockMat,list.length);
      im.castShadow=true;im.receiveShadow=true;
      list.forEach((sp,i)=>{
        RQ.setFromAxisAngle(new THREE.Vector3(0,1,0),sp[3]);
        RV.set(sp[0],-.06,sp[1]);RS.set(sp[2],sp[2]*rng(.8,1.25),sp[2]);
        RM.compose(RV,RQ,RS);im.setMatrixAt(i,RM);
      });
      im.instanceMatrix.needsUpdate=true;scenery.add(im);
      SOLIDS.push({mesh:im,spots:list.map(sp=>[sp[0],sp[1],sp[2],sp[3]]),rad:.42,base:-.06});
    });
  }

  /* Zelt als Geometrie: Firstzelt mit zwei Dachflächen, Giebeln und Eingang.
     Farben aus tent.png entnommen und aufgehellt, damit das Szenenlicht die
     Vorlagenwerte erzeugt statt sie ein zweites Mal abzudunkeln. */
  function tentGeo(){
    const L=.95,W=.72,Hh=.80;
    const V=[],C=[],I=[];
    const col=h=>{const c=new THREE.Color(h);c.convertSRGBToLinear();return c;};
    /* Blaukanal bewusst unter 0xC8: bei voller Sonne beträgt die Bestrahlung rund
       1,7 – ein höherer Wert würde clippen und das Dach würde ausbleichen. */
    const FAB=col("#5468C4"), GAB=col("#4A5CB4"), DOOR=col("#2E3474"), PEG=col("#9A5A50");
    function quad(a,b,c,d,cl){
      const o=V.length/3;
      [a,b,c,d].forEach(p=>{V.push(p[0],p[1],p[2]);C.push(cl.r,cl.g,cl.b);});
      I.push(o,o+1,o+2,o,o+2,o+3);
    }
    function tri(a,b,c,cl){
      const o=V.length/3;
      [a,b,c].forEach(p=>{V.push(p[0],p[1],p[2]);C.push(cl.r,cl.g,cl.b);});
      I.push(o,o+1,o+2);
    }
    const A0=[-L,Hh,0],A1=[L,Hh,0];
    const B0=[-L,0,-W],B1=[-L,0,W],B2=[L,0,-W],B3=[L,0,W];
    quad(A0,A1,B3,B1,FAB);                 /* Dach vorn  */
    quad(A1,A0,B0,B2,FAB);                 /* Dach hinten */
    tri(A0,B1,B0,GAB);                     /* Giebel      */
    tri(A1,B2,B3,GAB);
    /* Eingang als dunkles Dreieck auf dem vorderen Giebel */
    tri([-L-.01,Hh*.62,0],[-L-.01,0,W*.42],[-L-.01,0,-W*.42],DOOR);
    /* Heringe/Spannleinen als schmale Pfosten */
    [[-L*.9,-W*1.05],[L*.9,-W*1.05],[-L*.9,W*1.05],[L*.9,W*1.05]].forEach(q=>{
      const r=.05,h=.16;
      quad([q[0]-r,0,q[1]-r],[q[0]+r,0,q[1]-r],[q[0]+r,h,q[1]-r],[q[0]-r,h,q[1]-r],PEG);
      quad([q[0]+r,0,q[1]+r],[q[0]-r,0,q[1]+r],[q[0]-r,h,q[1]+r],[q[0]+r,h,q[1]+r],PEG);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(V),3));
    g.setAttribute("color",new THREE.BufferAttribute(new Float32Array(C),3));
    g.setIndex(I);g.computeVertexNormals();
    return g;
  }
  if(tentSpots.length){
    const tg=tentGeo();
    const tm=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
    const im=new THREE.InstancedMesh(tg,tm,tentSpots.length);
    const TM=new THREE.Matrix4(),TQ=new THREE.Quaternion(),TV=new THREE.Vector3(),TS=new THREE.Vector3();
    tentSpots.forEach((sp,i)=>{
      TQ.setFromAxisAngle(new THREE.Vector3(0,1,0),sp[2]);
      TV.set(sp[0],-.03,sp[1]);TS.set(1.15,1.15,1.15);
      TM.compose(TV,TQ,TS);im.setMatrixAt(i,TM);
    });
    im.instanceMatrix.needsUpdate=true;scenery.add(im);
    SOLIDS.push({mesh:im,spots:tentSpots.map(t=>[t[0],t[1],1.15,t[2]]),rad:1.15,base:-.03});
  }

  /* Instanzen aufbauen: eine Zeichenanweisung je Sprite-Art */
  const shGeo=new THREE.CircleGeometry(.5,12);
  const shMat=new THREE.MeshBasicMaterial({color:0x2C4632,transparent:true,opacity:.20,depthWrite:false});
  let shCount=0;for(const k in plan)shCount+=plan[k].x.length;
  const shadows=new THREE.InstancedMesh(shGeo,shMat,shCount);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),SC=new THREE.Vector3();
  const flat=new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2,0,0));
  let si=0;
  for(const key in plan){
    const p=plan[key],n=p.x.length;
    if(!n)continue;
    const im=new THREE.InstancedMesh(spriteGeo(key),spriteMat,n);
    im.frustumCulled=false;
    const mm=SPRITES[key];
    INST[key]={mesh:im,x:p.x,z:p.z,s:p.s,n,
      asp:mm.w/mm.h, vis:new Uint8Array(n).fill(1)};
    scenery.add(im);
    const st=SPRITE_STYLE[key];
    for(let i=0;i<n;i++){
      const r=p.s[i]*(1-st.sink)*.45;      /* Schatten passend zum sichtbaren Teil */
      V.set(p.x[i],.014,p.z[i]);SC.set(r,r,r);
      M.compose(V,flat,SC);shadows.setMatrixAt(si++,M);
    }
  }
  shadows.instanceMatrix.needsUpdate=true;scenery.add(shadows);

  /* 5) Boden: Gras- und Erdflecken in lockeren Nestern */
  function decal(key,x,z,size,rot,layer){
    const m=SPRITES[key];
    const g=new THREE.PlaneGeometry(size,size*(m.h/m.w));
    const uv=g.attributes.uv;
    uv.setXY(0,m.u0,1-m.v0); uv.setXY(1,m.u1,1-m.v0);
    uv.setXY(2,m.u0,1-m.v1); uv.setXY(3,m.u1,1-m.v1);
    const q=new THREE.Mesh(g,decalMat);
    q.rotation.x=-Math.PI/2;q.rotation.z=rot;
    q.position.set(x,.006+layer*.0009,z);
    decals.add(q);
  }
  const nests=[];let layer=0;
  for(let nI=0;nI<18;nI++){
    let c=null;
    for(let t=0;t<40&&!c;t++){
      const a=rnd()*Math.PI*2,d=rng(7,26);
      const x=Math.cos(a)*d,z=Math.sin(a)*d;
      let ok=clearFlat(x,z);
      for(const nt of nests)if(ok&&(nt[0]-x)**2+(nt[1]-z)**2<14)ok=false;
      if(ok)c=[x,z];
    }
    if(!c)continue;
    nests.push(c);
    const key=rnd()<.6?"patch-grass":"patch-dirt";
    const n=2+((rnd()*3)|0);
    for(let k=0;k<n;k++){
      const a=rnd()*Math.PI*2,d=rng(0,1.7);
      const x=c[0]+Math.cos(a)*d,z=c[1]+Math.sin(a)*d;
      if(!clearFlat(x,z))continue;
      decal(key,x,z,rng(1.3,2.6),rnd()*6.283,layer++);
    }
  }
})();

/* ── Kulisse an die aktuelle Bahn anpassen ────────────────────────
   Die Sperrzone beim Aufbau ist eine feste Ellipse und auf die Golfbahnen
   zugeschnitten. Die Murmelbahn ist deutlich größer und ragt darüber hinaus.
   Statt alles nach außen zu drängen, werden hier nur die Objekte ausgeblendet,
   deren Umriss die Bahn tatsächlich berühren würde. */
const CLEARANCE=.30;                  /* Luft zwischen Objekt und Bahnkante */
function distToCourse(x,z){
  let best=1e9;
  const cs=S.cells;
  for(let i=0;i<cs.length;i++){
    const dx=Math.abs(x-cs[i][0])-.5, dz=Math.abs(z-cs[i][1])-.5;
    const ax=dx>0?dx:0, az=dz>0?dz:0;
    const d=ax*ax+az*az;
    if(d<best){best=d;if(best<=0)return 0;}
  }
  return Math.sqrt(best);
}
const _CM=new THREE.Matrix4(),_CQ=new THREE.Quaternion(),
      _CV=new THREE.Vector3(),_CS=new THREE.Vector3(),_CY=new THREE.Vector3(0,1,0);
function cullScenery(){
  if(!S.cells||!S.cells.length)return;
  let hidden=0;
  for(const key in INST){
    const d=INST[key];
    for(let i=0;i<d.n;i++){
      const r=d.s[i]*d.asp*.5;                    /* halbe Breite des Sprites */
      const keep=distToCourse(d.x[i],d.z[i])>r+CLEARANCE;
      d.vis[i]=keep?1:0;if(!keep)hidden++;
    }
  }
  for(const g of SOLIDS){
    for(let i=0;i<g.spots.length;i++){
      const sp=g.spots[i];
      const r=g.rad*sp[2];
      const keep=distToCourse(sp[0],sp[1])>r+CLEARANCE;
      if(!keep)hidden++;
      _CQ.setFromAxisAngle(_CY,sp[3]);
      const sc=keep?sp[2]:0;
      _CV.set(sp[0],g.base,sp[1]);_CS.set(sc,sc,sc);
      _CM.compose(_CV,_CQ,_CS);g.mesh.setMatrixAt(i,_CM);
    }
    g.mesh.instanceMatrix.needsUpdate=true;
  }
  S.hiddenScenery=hidden;
}

/* Instanzmatrizen an den Kamerawinkel anpassen */
const _M=new THREE.Matrix4(),_Q=new THREE.Quaternion(),_E=new THREE.Euler(0,0,0,"YXZ"),
      _V=new THREE.Vector3(),_S=new THREE.Vector3();
function faceSprites(yaw){
  const face=yaw+Math.PI;            /* Normale muss zur Kamera zeigen */
  for(const key in INST){
    const d=INST[key];
    _E.set(0,face,0);_Q.setFromEuler(_E);
    for(let i=0;i<d.n;i++){
      const sc=d.vis[i]?d.s[i]:0;      /* ausgeblendet = auf Null skaliert */
      _V.set(d.x[i],0,d.z[i]);_S.set(sc,sc,sc);
      _M.compose(_V,_Q,_S);
      d.mesh.setMatrixAt(i,_M);
    }
    d.mesh.instanceMatrix.needsUpdate=true;
  }
}

const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];        // N,E,S,W
const BIT={N:1,E:2,S:4,W:8};
/* Basisteile mit ihren Wandmasken */
const BASE=[["open",0],["side",BIT.E],["straight",BIT.W|BIT.E],
            ["corner",BIT.E|BIT.S],["end",BIT.W|BIT.E|BIT.S]];
function rotMask(m,k){ // Drehung um 90°: E→N, N→W, W→S, S→E
  for(let i=0;i<k;i++){
    let r=0;
    if(m&BIT.E)r|=BIT.N; if(m&BIT.N)r|=BIT.W; if(m&BIT.W)r|=BIT.S; if(m&BIT.S)r|=BIT.E;
    m=r;
  }
  return m;
}
/* Kollisionsumriss eines Modells: Schnitt der Geometrie mit der Höhe des
   Ballmittelpunkts. Liefert exakt die Silhouette, die der Ball spüren kann –
   inklusive Torbögen und Durchfahrten. Keine Handschätzung mehr. */
function sliceMesh(name,y){
  const g=GEO[name];if(!g)return[];
  const P=g.attributes.position.array,I=g.index.array,out=[];
  for(let t=0;t<I.length;t+=3){
    const pts=[];
    for(let k=0;k<3;k++){
      const i=I[t+k]*3,j=I[t+(k+1)%3]*3;
      const y0=P[i+1],y1=P[j+1];
      if((y0-y)*(y1-y)<0){
        const u=(y-y0)/(y1-y0);
        pts.push([P[i]+u*(P[j]-P[i]),P[i+2]+u*(P[j+2]-P[i+2])]);
      }
    }
    if(pts.length===2){
      const dx=pts[0][0]-pts[1][0],dz=pts[0][1]-pts[1][1];
      if(dx*dx+dz*dz>1e-7)out.push([pts[0],pts[1]]);
    }
  }
  return out;
}
let WALLH=.146,WALLC=[.5,.35,.25];
/* Wandhöhe und -farbe aus dem Kachelmodell übernehmen, damit die Eckfüllung passt */
function wallStyle(){
  const g=GEO["side"];if(!g||!g.attributes.color)return;
  const P=g.attributes.position.array,C=g.attributes.color.array;
  let top=0,ci=0;
  for(let i=0;i<P.length;i+=3)if(P[i+1]>top){top=P[i+1];ci=i;}
  WALLH=top;WALLC=[C[ci],C[ci+1],C[ci+2]];
}
const SLICE={},SLICEY={};
/* Manche Modelle bringen eine eigene Bodenplatte mit (Ausdehnung bis ±0.5),
   andere sind freistehende Aufbauten und gehören auf die Grünoberfläche.
   Das erkennt das Spiel selbst an der Modellbreite. */
function modelBase(name){
  const g=GEO[name];if(!g)return 0;
  const P=g.attributes.position.array;
  let mn=9,mx=-9;
  for(let i=0;i<P.length;i+=3){if(P[i]<mn)mn=P[i];if(P[i]>mx)mx=P[i];}
  return (mx-mn>.98)?0:TOP;           /* volle Kachel -> bündig, sonst aufgesetzt */
}
function buildSlices(){
  ["obstacle-block","obstacle-diamond","obstacle-triangle","castle","mill-body",
   "structure-gate-wide","structure-gates","tunnel-wide","narrow-round","split"]
    .forEach(nm=>{
      const yb=modelBase(nm);
      SLICEY[nm]=yb;
      SLICE[nm]=sliceMesh(nm,TOP+R-yb);   /* Schnitt auf Ballmitte, relativ zum Modellfuß */
    });
}
const OBSTACLE_MESH={B:"obstacle-block",D:"obstacle-diamond",
                     A:"obstacle-triangle",C:"castle",M:"mill-body",
                     G:"structure-gate-wide",Z:"structure-gates",
                     U:"tunnel-wide",N:"narrow-round",Y:"split"};
const OBMESH={B:"obstacle-block",D:"obstacle-diamond",A:"obstacle-triangle",C:"castle",
  G:"structure-gate-wide",Z:"structure-gates",U:"tunnel-wide",N:"narrow-round",Y:"split"};
const MILL_PIVY=MODELDATA.pivot[1];   /* Nabe genau dort, wo das Modell sie vorsieht */
const MILL_SCALE=1.44;                /* Fenster 1.399–1.490: Spitze streift den Ball,
                                         bleibt aber über der Grünoberfläche */
const MILL_W=1.15;            /* Winkelgeschwindigkeit in rad/s */
const MILL_GATEZ=-.4458;      /* Flügelebene relativ zur Kachelmitte */
const MILL_HALFW=.205;        /* halbe Torbogenbreite */
/* Wie weit deckt der Flügel die Einfahrt gerade ab? Direkt aus der
   Modellgeometrie: Schnitt der gedrehten Flügel mit der Ballmittelpunkt-Höhe. */
let MILLCOV=null;
function buildMillCoverage(){
  const geo=GEO["mill-blades"];if(!geo)return;
  const P=geo.attributes.position.array,I=geo.index.array,yB=TOP+R;
  MILLCOV=[];
  for(let st=0;st<144;st++){
    const A=st/144*Math.PI*2,c=Math.cos(A),sn=Math.sin(A);
    let lo=1e9,hi=-1e9;
    for(let t=0;t<I.length;t+=3){
      const px=[],py=[];
      for(let k=0;k<3;k++){
        const i=I[t+k]*3,x=P[i],y=P[i+1];
        px.push((x*c-y*sn)*MILL_SCALE);py.push((x*sn+y*c)*MILL_SCALE+MILL_PIVY);
      }
      for(let k=0;k<3;k++){
        const a=k,b=(k+1)%3,y0=py[a],y1=py[b];
        if(y0!==y1&&(y0-yB)*(y1-yB)<=0){
          const x=px[a]+(yB-y0)/(y1-y0)*(px[b]-px[a]);
          if(x<lo)lo=x;if(x>hi)hi=x;
        }
      }
    }
    lo=Math.max(lo,-MILL_HALFW);hi=Math.min(hi,MILL_HALFW);
    MILLCOV.push(hi-lo>.004?[lo,hi]:null);
  }
}
function millGate(a){
  if(!MILLCOV)return null;
  const n=MILLCOV.length;
  let i=Math.floor((((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*n)%n;
  return MILLCOV[i];
}
function millBlocked(a){return millGate(a)!==null;}

function mergeInto(list,geo,mat4,tint){
  const g=geo.clone().applyMatrix4(mat4);
  /* Mähmuster: benachbarte Kacheln abwechselnd abdunkeln. Nur sattes Grün wird
     angefasst, Banden und Hindernisse bleiben unberührt. Aufhellen bringt
     nichts – der Grünkanal liegt unter voller Sonne bereits nahe der Sättigung
     und würde clippen, deshalb wird ausschließlich abgedunkelt. */
  if(tint&&tint!==1&&g.attributes.color){
    const c=g.attributes.color;
    for(let i=0;i<c.count;i++){
      const r=c.getX(i),gr=c.getY(i),b=c.getZ(i);
      if(gr>r*1.5&&gr>b*1.5&&gr>.28)c.setXYZ(i,r*tint,gr*tint,b*tint);
    }
  }
  list.push(g);
}
function buildHole(hi){
  while(world.children.length)world.remove(world.children[0]);
  balls.length=0;mill=null;millBody=null;millFade=1;MILLMAT.opacity=1;S.millCell=null;
  const C=courses()[hi],map=C.map;
  const H=map.length,W=Math.max(...map.map(r=>r.length));
  const grid=[];
  for(let z=0;z<H;z++){grid.push([]);for(let x=0;x<W;x++)grid[z].push((map[z][x]||".").toUpperCase());}
  const play=(x,z)=>x>=0&&z>=0&&x<W&&z<H&&grid[z][x]!==".";
  const ox=-(W-1)/2, oz=-(H-1)/2;
  /* Höhenfeld und Checkpoints müssen stehen, bevor Kacheln gebaut werden:
     hAt() wird schon beim Setzen von Fahne und Ball gebraucht. */
  const isTrack=!!C.hgt;
  S.W=W;S.H=H;S.ox=ox;S.oz=oz;S.playFn=play;S.track=isTrack;
  S.hgrid=isTrack?buildHeights(C,W,H,play):null;
  S.checkCells=null;
  if(isTrack){
    S.checkCells={};
    for(let z=0;z<H;z++)for(let x=0;x<W;x++)
      if(grid[z][x]==="K")S.checkCells[x+","+z]=1;
  }

  const parts=[],walls=[],cells=[];
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    const ch=grid[z][x]; if(ch===".")continue;
    const wx=x+ox, wz=z+oz;
    cells.push([wx,wz]);
    let mask=0;
    for(let d=0;d<4;d++){
      const nb=[x+DIRS[d][0],z+DIRS[d][1]];
      if(!play(nb[0],nb[1])){
        mask|=[BIT.N,BIT.E,BIT.S,BIT.W][d];
        const n=DIRS[d];
        /* Freie Brückenstücke bekommen kein Geländer – dort kann der Ball fallen */
        if(!(isTrack&&(ch==="="||ch==="e"))){
          if(n[0]!==0)walls.push({a:[wx+n[0]*.4,wz-.5],b:[wx+n[0]*.4,wz+.5],n:[-n[0],0]});
          else        walls.push({a:[wx-.5,wz+n[1]*.4],b:[wx+.5,wz+n[1]*.4],n:[0,-n[1]]});
        }
      }
    }
    /* passendes Bodenteil + Drehung suchen */
    let mesh="open",rot=0;
    outer: for(const [nm,bm] of BASE) for(let k=0;k<4;k++)
      if(rotMask(bm,k)===mask){mesh=nm;rot=k;break outer;}
    const M=new THREE.Matrix4().makeRotationY(rot*Math.PI/2);
    M.setPosition(wx,0,wz);
    if(isTrack){
      if(ch==="H"){
        S.cup=[wx,wz];
        const fl=new THREE.Mesh(GEO["flag-red"],MAT);
        fl.position.set(wx,hAt(wx,wz),wz);fl.castShadow=true;world.add(fl);
        const cm=new THREE.Mesh(new THREE.CircleGeometry(.10,24),
          new THREE.MeshBasicMaterial({color:0x14202B}));
        cm.rotation.x=-Math.PI/2;cm.position.set(wx,hAt(wx,wz)+.002,wz);world.add(cm);
      }
      if(ch==="T")S.tee=[wx,wz];
    }else if(ch==="H"){ // Loch: offene Platte mit Becher + evtl. Wände separat
      const ht=((x+z)&1)?1:.86;
      mergeInto(parts,GEO["hole-open"],new THREE.Matrix4().setPosition(wx,0,wz),ht);
      if(mask){ const M2=new THREE.Matrix4().makeRotationY(rot*Math.PI/2);M2.setPosition(wx,0.0001,wz);
        mergeInto(parts,GEO[mesh],M2,ht); }
      S.cup=[wx,wz];
      const fl=new THREE.Mesh(GEO["flag-red"],MAT);
      fl.position.set(wx,TOP,wz);fl.castShadow=true;world.add(fl);
      /* dunkle Lochscheibe, damit das Loch aus der tiefen Kamera sichtbar ist */
      const cupMark=new THREE.Mesh(new THREE.CircleGeometry(.10,24),
        new THREE.MeshBasicMaterial({color:0x14202B}));
      cupMark.rotation.x=-Math.PI/2;cupMark.position.set(wx,TOP+.002,wz);world.add(cupMark);
    }else{
      mergeInto(parts,GEO[mesh],M,((x+z)&1)?1:.86);
    }
    if(!isTrack&&ch==="T")S.tee=[wx,wz];
    if(OBMESH[ch]){
      const yb=SLICEY[OBSTACLE_MESH[ch]]||0;
      /* Alle Durchfahrten der Modelle verlaufen entlang z. Liegen die offenen
         Nachbarkacheln in x-Richtung, muss das Hindernis eine Vierteldrehung
         bekommen – sonst zeigt das Tor quer zur Laufrichtung. */
      const openZ=(play(x,z-1)?1:0)+(play(x,z+1)?1:0);
      const openX=(play(x-1,z)?1:0)+(play(x+1,z)?1:0);
      const rot=(openX>openZ)?Math.PI/2:0;
      const MO=new THREE.Matrix4().makeRotationY(rot);
      MO.setPosition(wx,yb+.0012,wz);
      mergeInto(parts,GEO[OBMESH[ch]],MO);
      const cs=Math.cos(rot),sn=Math.sin(rot);
      const turn=q=>[q[0]*cs+q[1]*sn+wx,-q[0]*sn+q[1]*cs+wz];
      (SLICE[OBSTACLE_MESH[ch]]||[]).forEach(sg=>
        walls.push({a:turn(sg[0]),b:turn(sg[1])}));
    }
    if(ch==="M"){
      const bd=new THREE.Mesh(GEO["mill-body"],MILLMAT);
      bd.position.set(wx,.0012,wz);
      bd.castShadow=true;bd.receiveShadow=true;world.add(bd);millBody=bd;
      const bl=new THREE.Mesh(GEO["mill-blades"],MILLMAT);
      const pv=MODELDATA.pivot;
      bl.scale.setScalar(MILL_SCALE);
      bl.position.set(wx+pv[0],MILL_PIVY,wz+pv[2]);
      bl.castShadow=true;world.add(bl);mill=bl;
      (SLICE["mill-body"]||[]).forEach(sg=>
        walls.push({a:[sg[0][0]+wx,sg[0][1]+wz],b:[sg[1][0]+wx,sg[1][1]+wz]}));
      S.millCell=[wx,wz];
    }
  }
  /* Innenecken schließen. Die Wandsegmente sitzen 0.1 innerhalb der Kachelkante,
     wie im Modell. An einer konkaven Ecke – drei Kacheln bespielbar, die vierte
     leer – enden zwei senkrecht zueinander stehende Wände versetzt und lassen
     eine Kerbe von 0.1 x 0.1 offen. Deren Diagonale misst 0.141 und ist damit
     größer als der Balldurchmesser von 0.11: Der Ball schlüpft diagonal hinaus. */
  for(let z=-1;z<H;z++)for(let x=-1;x<W;x++){
    const A=play(x,z),B=play(x+1,z),Cc=play(x,z+1),D=play(x+1,z+1);
    if((A?1:0)+(B?1:0)+(Cc?1:0)+(D?1:0)!==3)continue;
    const cx=x+.5+ox, cz=z+.5+oz;
    const sx=(!A||!Cc)?-1:1;        /* fehlende Kachel im Westen? */
    const sz=(!A||!B)?-1:1;         /* fehlende Kachel im Norden? */
    /* Auf freien Brückenstücken bleibt die Ecke bewusst offen */
    const inner=(gx,gz)=>{const c=(grid[gz]&&grid[gz][gx])||".";return c==="="||c==="e";};
    if(isTrack&&(inner(x,z)||inner(x+1,z)||inner(x,z+1)||inner(x+1,z+1)))continue;
    walls.push({a:[cx-sx*.1,cz],b:[cx,cz-sz*.1]});
    const bh=isTrack?RAILH:WALLH, by=isTrack?hAt(cx,cz)-TOP:0;
    const bg=new THREE.BoxGeometry(.104,bh+(isTrack?.02:0),.104);
    bg.translate(cx-sx*.052,by+bh/2,cz-sz*.052);
    const vn=bg.attributes.position.count,col=new Float32Array(vn*3);
    const wc=isTrack?(()=>{const c=new THREE.Color(CRAIL);c.convertSRGBToLinear();return[c.r,c.g,c.b];})():WALLC;
    for(let i=0;i<vn;i++){col[i*3]=wc[0];col[i*3+1]=wc[1];col[i*3+2]=wc[2];}
    bg.setAttribute("color",new THREE.BufferAttribute(col,3));
    bg.deleteAttribute("uv");
    parts.push(bg);
  }

  if(isTrack)buildTrack(parts,W,H,ox,oz,play,grid);
  /* Alles Statische zu einer Geometrie verschmelzen */
  const merged=mergeGeoms(parts);
  const groundMesh=new THREE.Mesh(merged,MAT);
  groundMesh.castShadow=true;groundMesh.receiveShadow=true;world.add(groundMesh);

  S.walls=walls;S.cells=cells;
  cullScenery();
  /* Grobraster: pro Kachel nur die Segmente prüfen, die sie berühren */
  S.segGrid=new Map();
  walls.forEach((w,i)=>{
    const x0=Math.min(w.a[0],w.b[0])-R-.03,x1=Math.max(w.a[0],w.b[0])+R+.03;
    const z0=Math.min(w.a[1],w.b[1])-R-.03,z1=Math.max(w.a[1],w.b[1])+R+.03;
    for(let gx=Math.floor(x0+.5);gx<=Math.floor(x1+.5);gx++)
      for(let gz=Math.floor(z0+.5);gz<=Math.floor(z1+.5);gz++){
        const k=gx*4096+gz;
        let a=S.segGrid.get(k);if(!a){a=[];S.segGrid.set(k,a);}
        a.push(i);
      }
  });
  S.grid=grid;S.W=W;S.H=H;S.ox=ox;S.oz=oz;S.playFn=play;
  /* Wegdistanzfeld vom Loch aus (damit Bots auch um Ecken finden) */
  const D=[];for(let z=0;z<H;z++){D.push(new Array(W).fill(999));}
  const cgx=Math.round(S.cup[0]-ox),cgz=Math.round(S.cup[1]-oz);
  D[cgz][cgx]=0;const q=[[cgx,cgz]];
  while(q.length){const c=q.shift();
    for(const d of DIRS){const nx=c[0]+d[0],nz=c[1]+d[1];
      if(play(nx,nz)&&D[nz][nx]>D[c[1]][c[0]]+1){D[nz][nx]=D[c[1]][c[0]]+1;q.push([nx,nz]);}}}
  S.D=D;
  S.bounds={minx:ox-.5,maxx:ox+W-.5,minz:oz-.5,maxz:oz+H-.5,w:W,h:H};

  /* Bälle */
  S.players.forEach((p,i)=>{
    p.check=[S.tee[0],S.tee[1]];p.fallY=undefined;p.fallV=0;
    const col=new THREE.Color(p.hex);col.convertSRGBToLinear();
    const m=new THREE.Mesh(ballGeo,new THREE.MeshPhongMaterial({
      color:col,shininess:64,specular:new THREE.Color(.30,.30,.30)}));
    m.castShadow=true;m.position.set(S.tee[0],hAt(S.tee[0],S.tee[1])+R,S.tee[1]);
    world.add(m);balls.push(m);
    p.pos=[S.tee[0],S.tee[1]];p.vel=[0,0];p.strokes=0;p.done=false;
  });
  /* Kamera grob von Abschlag Richtung Loch ausrichten */
  S.camYaw=S.camYawT=Math.atan2(S.cup[0]-S.tee[0],S.cup[1]-S.tee[1])+Math.PI;
}
function mergeGeoms(list){
  let vc=0,ic=0;
  for(const g of list){vc+=g.attributes.position.count;ic+=g.index.count;}
  const pos=new Float32Array(vc*3),nor=new Float32Array(vc*3),col=new Float32Array(vc*3);
  const idx=(vc>65535)?new Uint32Array(ic):new Uint16Array(ic);
  let vo=0,io=0;
  for(const g of list){
    const p=g.attributes.position.array,n=g.attributes.normal.array,c=g.attributes.color.array,I=g.index.array;
    pos.set(p,vo*3);nor.set(n,vo*3);col.set(c,vo*3);
    for(let i=0;i<I.length;i++)idx[io+i]=I[i]+vo;
    vo+=g.attributes.position.count;io+=I.length;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute("position",new THREE.BufferAttribute(pos,3));
  out.setAttribute("normal",new THREE.BufferAttribute(nor,3));
  out.setAttribute("color",new THREE.BufferAttribute(col,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  return out;
}

/* ═══════════ Physik ═══════════ */
function collide(pos,vel,rad,millA){
  let hit=false;
  /* Rotierender Flügel versperrt den Torbogen */
  const gate=(S.millCell&&millA!==undefined)?millGate(millA):null;
  if(gate){
    const gz=S.millCell[1]+MILL_GATEZ, gx=S.millCell[0];
    const ax=gx+gate[0],az=gz,bx=gx+gate[1],bz=gz;
    const vx=bx-ax,vz=bz-az;
    const t=Math.max(0,Math.min(1,((pos[0]-ax)*vx+(pos[1]-az)*vz)/(vx*vx+vz*vz)));
    const cx=ax+t*vx,cz=az+t*vz;
    let dx=pos[0]-cx,dz=pos[1]-cz,d=Math.hypot(dx,dz);
    if(d<rad&&d>1e-9){
      dx/=d;dz/=d;
      pos[0]=cx+dx*rad;pos[1]=cz+dz*rad;
      const vn=vel[0]*dx+vel[1]*dz;
      if(vn<0){vel[0]-=(1+REST)*vn*dx;vel[1]-=(1+REST)*vn*dz;vel[0]*=TANG;vel[1]*=TANG;hit=true;}
    }
  }
  const key=Math.floor(pos[0]+.5)*4096+Math.floor(pos[1]+.5);
  const near=S.segGrid?S.segGrid.get(key):null;
  const list=near?near:S.walls.map((_,i)=>i);
  for(const wi of list){
    const w=S.walls[wi];
    const ax=w.a[0],az=w.a[1],bx=w.b[0],bz=w.b[1];
    const vx=bx-ax,vz=bz-az,wx=pos[0]-ax,wz=pos[1]-az;
    const t=Math.max(0,Math.min(1,(vx*wx+vz*wz)/(vx*vx+vz*vz)));
    const cx=ax+t*vx,cz=az+t*vz;
    let dx=pos[0]-cx,dz=pos[1]-cz,d=Math.hypot(dx,dz);
    if(d<rad&&d>1e-9){
      dx/=d;dz/=d;
      pos[0]=cx+dx*rad;pos[1]=cz+dz*rad;
      const vn=vel[0]*dx+vel[1]*dz;
      if(vn<0){
        vel[0]-=(1+REST)*vn*dx;vel[1]-=(1+REST)*vn*dz;
        vel[0]*=TANG;vel[1]*=TANG;
        hit=true;
      }
    }
  }
  return hit;
}
/* Ein Schlag komplett durchrechnen; liefert Endposition und ob eingelocht */
function simulate(pos0,vel0,record,millA0){
  const pos=[pos0[0],pos0[1]],vel=[vel0[0],vel0[1]];
  const dt=1/240;let holed=false,steps=0;
  let mA=(millA0===undefined)?undefined:millA0;
  let fell=false;
  while(steps<240*20){
    steps++;
    /* Hang zuerst, dann Rollreibung */
    let gx=0,gz=0;
    if(S.hgrid){
      const gr=gradAt(pos[0],pos[1]);
      gx=-GRAV*gr[0];gz=-GRAV*gr[1];
      vel[0]+=gx*dt;vel[1]+=gz*dt;
    }
    const sp=Math.hypot(vel[0],vel[1]);
    const pull=Math.hypot(gx,gz);
    if(!(sp>.012)&&pull<DEC)break;          /* liegen bleiben nur im Flachen */
    if(sp>1e-9){
      const nsp=Math.max(0,sp-DEC*dt);
      vel[0]=vel[0]/sp*nsp;vel[1]=vel[1]/sp*nsp;
    }
    pos[0]+=vel[0]*dt;pos[1]+=vel[1]*dt;
    if(mA!==undefined)mA+=MILL_W*dt;
    collide(pos,vel,R,mA);
    if(S.hgrid&&!onTrack(pos[0],pos[1])){fell=true;break;}
    const dh=Math.hypot(pos[0]-S.cup[0],pos[1]-S.cup[1]);
    if(dh<HOLE_R&&Math.hypot(vel[0],vel[1])<HOLE_V){holed=true;break;}
    if(record&&steps%6===0)record.push([pos[0],pos[1]]);
  }
  return {pos,holed,fell};
}

/* ═══════════ Murmelbahn: Strecke über mehrere Ebenen ═══════════
   Ein Höhenfeld je Kachel bestimmt Physik UND Geometrie gemeinsam. Die
   Streckenoberfläche wird daraus erzeugt, statt fertige Rampenmodelle zu
   setzen – so kann Sichtbares und Kollision nicht auseinanderlaufen. */
const LEVEL=.34;                 /* Höhe einer Stufe */
const GRAV=9.81;                 /* Hangbeschleunigung */
const RAILH=.083;                /* Geländerhöhe über der Fahrbahn */
const CGREEN=0x61CB8B,CRAIL=0xEB9268,CSIDE=0xB36343,CPIER=0xCF7A55,CCHECK=0xF2C14E;

/* Höhenraster aufbauen. Leere Kacheln erben die Höhe des höchsten
   bespielbaren Nachbarn, damit die Oberfläche am Rand nicht einbricht. */
function buildHeights(C,W,H,play){
  const raw=[],hg=[];
  for(let z=0;z<H;z++){
    raw.push([]);hg.push([]);
    for(let x=0;x<W;x++){
      const ch=C.hgt?((C.hgt[z]||"")[x]||""):"";
      raw[z].push(ch&&ch!==" "?parseInt(ch,36):null);
      hg[z].push(0);
    }
  }
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    if(play(x,z)){hg[z][x]=(raw[z][x]||0)*LEVEL;continue;}
    let best=null;
    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,nz=z+dz;
      if(play(nx,nz)){const v=(raw[nz][nx]||0)*LEVEL;if(best===null||v>best)best=v;}
    }
    hg[z][x]=best===null?0:best;
  }
  return hg;
}
/* Oberflächenhöhe an einem Weltpunkt, bilinear zwischen den Kachelmitten */
function hAt(wx,wz){
  const g=S.hgrid;if(!g)return TOP;
  const fx=wx-S.ox,fz=wz-S.oz;
  const x0=Math.floor(fx),z0=Math.floor(fz),tx=fx-x0,tz=fz-z0;
  const cl=(x,z)=>g[Math.max(0,Math.min(S.H-1,z))][Math.max(0,Math.min(S.W-1,x))];
  const a=cl(x0,z0),b=cl(x0+1,z0),c=cl(x0,z0+1),d=cl(x0+1,z0+1);
  return TOP+(a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
}
/* Gefälle als Vektor – daraus folgt die Hangbeschleunigung */
function gradAt(wx,wz){
  if(!S.hgrid)return[0,0];
  const e=.06;
  return[(hAt(wx+e,wz)-hAt(wx-e,wz))/(2*e),(hAt(wx,wz+e)-hAt(wx,wz-e))/(2*e)];
}
/* Steht der Ball noch auf der Strecke? */
function onTrack(wx,wz){
  if(!S.hgrid)return true;
  const gx=Math.round(wx-S.ox),gz=Math.round(wz-S.oz);
  return S.playFn?S.playFn(gx,gz):true;
}
/* Checkpoint unter dem Ball? */
function checkAt(wx,wz){
  if(!S.checkCells)return null;
  const gx=Math.round(wx-S.ox),gz=Math.round(wz-S.oz);
  const k=gx+","+gz;
  return S.checkCells[k]?[gx+S.ox,gz+S.oz]:null;
}

/* Streckenoberfläche aus dem Höhenfeld erzeugen: Fahrbahn, Geländer, Pfeiler.
   Jede Kachel wird 2x2 unterteilt, damit Rampen rund statt eckig wirken. */
function buildTrack(parts,W,H,ox,oz,play,grid){
  const V=[],C=[],I=[];
  const col=h=>{const c=new THREE.Color(h);c.convertSRGBToLinear();return c;};
  const GR=col(CGREEN),RA=col(CRAIL),SI=col(CSIDE),PI=col(CPIER),CK=col(CCHECK);
  const push4=(a,b,c,d,k)=>{
    const o=V.length/3;
    [a,b,c,d].forEach(p=>{V.push(p[0],p[1],p[2]);C.push(k.r,k.g,k.b);});
    I.push(o,o+1,o+2,o,o+2,o+3);
  };
  /* Viereck mit garantierter Ausrichtung: zeigt die errechnete Normale in die
     falsche Richtung, wird die Reihenfolge umgekehrt. Das erspart es, für
     jede Kantenrichtung von Hand den richtigen Umlaufsinn zu treffen. */
  const quad=(a,b,c,d,k,ref)=>{
    if(ref){
      const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-b[0],c[1]-b[1],c[2]-b[2]];
      const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
      if(n[0]*ref[0]+n[1]*ref[1]+n[2]*ref[2]<0){push4(d,c,b,a,k);return;}
    }
    push4(a,b,c,d,k);
  };
  const UP=[0,1,0];
  const N=2;                                  /* Unterteilung je Kachel */
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    if(!play(x,z))continue;
    const wx=x+ox,wz=z+oz, ch=grid[z][x];
    const top=(ch==="K")?CK:CGREEN;
    const tc=col(top);
    if(ch!=="K"){const f=((x+z)&1)?1:.86;tc.r*=f;tc.g*=f;tc.b*=f;}
    /* Fahrbahn */
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const x0=wx-.5+i/N,x1=wx-.5+(i+1)/N,z0=wz-.5+j/N,z1=wz-.5+(j+1)/N;
      /* Reihenfolge so, dass die Normale nach oben zeigt */
      quad([x0,hAt(x0,z0),z0],[x0,hAt(x0,z1),z1],[x1,hAt(x1,z1),z1],[x1,hAt(x1,z0),z0],tc,UP);
    }
    /* Geländer an offenen Kanten – außer bei »=« (freie Brücke) */
    if(ch!=="="&&ch!=="e"){
      for(let d=0;d<4;d++){
        const n=DIRS[d];
        if(play(x+n[0],z+n[1]))continue;
        const inn=.40,out=.475;
        for(let i=0;i<N;i++){
          const t0=-.5+i/N,t1=-.5+(i+1)/N;
          let a0,a1,b0,b1;
          if(n[0]!==0){
            a0=[wx+n[0]*inn,0,wz+t0];a1=[wx+n[0]*inn,0,wz+t1];
            b0=[wx+n[0]*out,0,wz+t0];b1=[wx+n[0]*out,0,wz+t1];
          }else{
            a0=[wx+t0,0,wz+n[1]*inn];a1=[wx+t1,0,wz+n[1]*inn];
            b0=[wx+t0,0,wz+n[1]*out];b1=[wx+t1,0,wz+n[1]*out];
          }
          [a0,a1,b0,b1].forEach(p=>{p[1]=hAt(p[0],p[2]);});
          const up=p=>[p[0],p[1]+RAILH,p[2]];
          const outw=[n[0],0,n[1]], inw=[-n[0],0,-n[1]];
          quad(up(a0),up(a1),up(b1),up(b0),RA,UP);         /* Oberseite  */
          quad(a1,up(a1),up(a0),a0,SI,inw);                /* Innenflanke */
          quad(b0,up(b0),up(b1),b1,SI,outw);               /* Außenflanke */
        }
      }
    }
    /* Pfeiler, wo die Strecke über dem Boden schwebt */
    const hc=hAt(wx,wz);
    if(hc>TOP+.20){
      /* Der Deckel darf nicht an der Kachelmitte hängen: auf einer Rampe faellt
         die Fahrbahn zum Pfeilerrand hin ab und der Deckel ragte sonst als
         Huckel durch die Strecke. Massgeblich ist die tiefste Stelle. */
      const r=.13,y0=0;
      let lo=hc;
      for(const d of [[-r,-r],[r,-r],[r,r],[-r,r],[0,0]]){
        const hh=hAt(wx+d[0],wz+d[1]);if(hh<lo)lo=hh;
      }
      const y1=lo-.03;
      const cs=[[-r,-r],[r,-r],[r,r],[-r,r]];
      for(let k=0;k<4;k++){
        const a=cs[k],b=cs[(k+1)%4];
        const mid=[(a[0]+b[0])/2,0,(a[1]+b[1])/2];
        quad([wx+a[0],y1,wz+a[1]],[wx+b[0],y1,wz+b[1]],
             [wx+b[0],y0,wz+b[1]],[wx+a[0],y0,wz+a[1]],PI,mid);
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(V),3));
  g.setAttribute("color",new THREE.BufferAttribute(new Float32Array(C),3));
  g.setIndex(I);g.computeVertexNormals();
  parts.push(g);
}

/* ═══════════ Firebase-Speicher (REST, ohne SDK) ═══════════ */
const DB="https://minigolf-992ba-default-rtdb.europe-west1.firebasedatabase.app";
const NET={ok:null,name:"Spieler",records:{}};
async function dbFetch(path,opt,ms){
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),ms||6000);
  try{
    const r=await fetch(DB+path,Object.assign({signal:ctl.signal},opt||{}));
    clearTimeout(to);
    if(!r.ok)throw new Error("HTTP "+r.status);
    NET.ok=true;
    const t=await r.text();
    return t&&t!=="null"?JSON.parse(t):null;
  }catch(e){clearTimeout(to);NET.ok=false;return null;}
}
const dbGet =p=>dbFetch(p);
const dbPut =(p,d)=>dbFetch(p,{method:"PUT",body:JSON.stringify(d),
  headers:{"Content-Type":"application/json"}});
const dbPost=(p,d)=>dbFetch(p,{method:"POST",body:JSON.stringify(d),
  headers:{"Content-Type":"application/json"}});

/* Bahnrekorde laden */
async function loadRecords(){
  const r=await dbGet("/rekorde.json");
  NET.records=r||{};
  updateHud();
}
/* Bahnrekord melden, wenn unterboten */
async function pushRecord(hole,strokes,name){
  const cur=NET.records[hole];
  if(cur&&cur.s<=strokes)return false;
  NET.records[hole]={n:name,s:strokes};
  await dbPut("/rekorde/"+hole+".json",{n:name,s:strokes,t:Date.now()});
  return true;
}
/* Runde in die Bestenliste eintragen */
async function pushRound(name,total,diff){
  await dbPost("/bestenliste.json",{n:name,s:total,d:diff,t:Date.now()});
}
/* Top-10 holen: nach Schlüssel begrenzen (kein Index nötig), dann lokal sortieren */
async function loadBoard(){
  const r=await dbGet('/bestenliste.json?orderBy="$key"&limitToLast=200');
  if(!r)return null;
  return Object.values(r)
    .filter(e=>e&&typeof e.s==="number")
    .sort((a,b)=>(a.d-b.d)||(a.s-b.s)||(a.t-b.t))
    .slice(0,10);
}

/* ═══════════ Klang: prozedurale Musik + Effekte ═══════════ */
const AUDIO={ctx:null,master:null,musicBus:null,sfxBus:null,on:true,timer:null,step:0,started:false};
function audioInit(){
  if(AUDIO.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  const ctx=new AC();AUDIO.ctx=ctx;
  const master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;
  comp.connect(master);
  AUDIO.master=master;
  const mb=ctx.createGain();mb.gain.value=.42;
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2000;lp.Q.value=.6;
  mb.connect(lp);lp.connect(comp);AUDIO.musicBus=mb;
  const sb=ctx.createGain();sb.gain.value=.85;sb.connect(comp);AUDIO.sfxBus=sb;
}
/* Ein weicher Ton mit Hüllkurve */
function tone(bus,freq,t0,dur,type,peak,detune){
  const c=AUDIO.ctx;if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t0+Math.min(.06,dur*.25));
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+dur+.05);
}
/* Rauschstoß für perkussive Effekte */
function noise(bus,t0,dur,freq,peak,type){
  const c=AUDIO.ctx;if(!c)return;
  const n=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource();src.buffer=buf;
  const f=c.createBiquadFilter();f.type=type||"bandpass";f.frequency.value=freq;f.Q.value=1.1;
  const g=c.createGain();g.gain.setValueAtTime(peak,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(f);f.connect(g);g.connect(bus);src.start(t0);src.stop(t0+dur+.02);
}
/* Ruhige Schleife: Akkordteppich + sparsame Melodie in F-Dur-Pentatonik */
const CHORDS=[[174.61,220.00,261.63],   // F
              [196.00,246.94,293.66],   // G-moll-artig
              [220.00,261.63,329.63],   // A-moll
              [155.56,196.00,233.08]];  // Es
const MEL=[523.25,587.33,698.46,783.99,880.00,783.99,698.46,587.33];
function musicTick(){
  if(!AUDIO.ctx||!AUDIO.on)return;
  const c=AUDIO.ctx,t=c.currentTime+.06,bus=AUDIO.musicBus;
  const bar=AUDIO.step%16, ch=CHORDS[(AUDIO.step/16|0)%CHORDS.length];
  if(bar===0)ch.forEach((f,i)=>tone(bus,f,t,3.9,"triangle",.075,i===1?4:-3));
  if(bar%4===0)tone(bus,ch[0]/2,t,1.0,"sine",.11);
  if(bar%2===0&&Math.random()<.55){
    const f=MEL[(AUDIO.step/2|0)%MEL.length];
    tone(bus,f,t,.7,"sine",.055);
    tone(bus,f*2,t,.42,"sine",.016);
  }
  if(bar%8===4)noise(bus,t,.16,2600,.02,"highpass");
  AUDIO.step++;
}
function musicStart(){
  audioInit();if(!AUDIO.ctx)return;
  if(AUDIO.ctx.state==="suspended")AUDIO.ctx.resume();
  if(AUDIO.timer)return;
  AUDIO.step=0;AUDIO.timer=setInterval(musicTick,250);   // 16tel bei 60 BPM
  musicTick();
}
function sfxHit(power){
  audioInit();if(!AUDIO.ctx||!AUDIO.on)return;
  const t=AUDIO.ctx.currentTime,b=AUDIO.sfxBus;
  noise(b,t,.055,900+power*900,.30+power*.28,"bandpass");
  tone(b,150+power*130,t,.10,"triangle",.16+power*.12);
}
function sfxBounce(v){
  audioInit();if(!AUDIO.ctx||!AUDIO.on)return;
  const t=AUDIO.ctx.currentTime,b=AUDIO.sfxBus;
  const k=Math.min(1,v/5);
  noise(b,t,.035,420+k*600,.05+k*.16,"bandpass");
}
function sfxHole(){
  audioInit();if(!AUDIO.ctx||!AUDIO.on)return;
  const t=AUDIO.ctx.currentTime,b=AUDIO.sfxBus;
  noise(b,t,.09,240,.30,"lowpass");                       // Plopp im Becher
  [659.25,783.99,987.77,1318.5].forEach((f,i)=>
    tone(b,f,t+.10+i*.075,.34,"sine",.14));
}
function audioToggle(){
  AUDIO.on=!AUDIO.on;
  if(AUDIO.master)AUDIO.master.gain.value=AUDIO.on?.9:0;
  const b=document.getElementById("sndBtn");
  if(b)b.textContent=AUDIO.on?"\u266A":"\u2715";
}

/* ═══════════ Spielablauf ═══════════ */
const $=id=>document.getElementById(id);
const cur=()=>S.players[S.act];
const totalOf=p=>{let d=0;p.scores.forEach((s,i)=>d+=s-courses()[i].par);return d;};
const fmtD=d=>d===0?"E":(d>0?"+"+d:""+d);

function buildSetup(){
  const cn=$("chipsN");cn.innerHTML="";
  [0,1,2,3].forEach(n=>{
    const b=document.createElement("button");
    b.className="chip"+(n===S.nBots?" on":"");

  });

  });
}
function makePlayers(){
  S.players=[{...MECOL,name:NET.name,bot:false,scores:[]}];
  for(let i=0;i<S.nBots;i++)S.players.push({...BOTCOL[i],bot:true,skill:SKILLS[S.diff],scores:[]});
}
/* Auf der Murmelbahn spielen alle gleichzeitig: jeder Spieler führt seinen
   eigenen Zustand (p.ph) und wird unabhängig weitergerechnet. Bei den
   Golfbahnen bleibt es beim Reihum-Spiel, dort spiegelt p.ph nur S.phase. */
const SIM=()=>S.mode==="marble";
/* Bewegt einen Ball um dt weiter und meldet, was passiert ist:
   "roll" laeuft weiter, "stop" liegt still, "fall" ist abgestuerzt,
   "hole" ist eingelocht. Beide Spielweisen rechnen damit identisch. */
function advanceBall(p,dt){
  let sub=Math.ceil(dt/(1/240));sub=Math.min(sub,24);
  const h=dt/sub;
  for(let i=0;i<sub;i++){
    let pull=0;
    if(S.hgrid){
      const gr=gradAt(p.pos[0],p.pos[1]);
      p.vel[0]-=GRAV*gr[0]*h;p.vel[1]-=GRAV*gr[1]*h;
      pull=GRAV*Math.hypot(gr[0],gr[1]);
    }
    const sp=Math.hypot(p.vel[0],p.vel[1]);
    if(sp>.012||pull>DEC){
      if(sp>1e-9){
        const nsp=Math.max(0,sp-DEC*h);
        p.vel[0]=p.vel[0]/sp*nsp;p.vel[1]=p.vel[1]/sp*nsp;
      }
      p.pos[0]+=p.vel[0]*h;p.pos[1]+=p.vel[1]*h;
      if(collide(p.pos,p.vel,R,S.millA)&&sp>.35&&S.t-S.lastBounce>.06){
        S.lastBounce=S.t;sfxBounce(sp);
      }
    }else{p.vel[0]=p.vel[1]=0;}
    if(S.hgrid&&!onTrack(p.pos[0],p.pos[1])){
      p.fallY=hAt(p.pos[0],p.pos[1]);p.fallV=0;return "fall";
    }
    const dh=Math.hypot(p.pos[0]-S.cup[0],p.pos[1]-S.cup[1]);
    if(dh<HOLE_R&&Math.hypot(p.vel[0],p.vel[1])<HOLE_V){
      p.vel=[0,0];p.pos=[S.cup[0],S.cup[1]];return "hole";
    }
  }
  return Math.hypot(p.vel[0],p.vel[1])<=.012?"stop":"roll";
}
/* Spieler ist wieder am Zug (nur Simultanmodus) */
function simReady(p,i){
  p.ph=p.bot?"bot":"aim";p.botT=0;p.plan=null;
  if(!p.bot){
    S.aim=Math.atan2(S.cup[0]-p.pos[0],S.cup[1]-p.pos[1]);
    S.camYawT=S.aim;S.power=0;
  }
  updateHud();
}
function simFinish(p,i,score,txt){
  p.done=true;p.scores.push(score);p.ph="done";
  if(balls[i])balls[i].visible=false;
  banner(txt);updateBoard();
  if(S.players.every(q=>q.done))setTimeout(finishHole,800);
}
function stepSim(dt){
  S.players.forEach((p,i)=>{
    if(p.done)return;
    if(p.ph==="bot"){
      p.botT+=dt;
      if(!p.plan&&p.botT>.35)p.plan=botThink(p);
      if(p.plan&&p.botT>.95){const pl=p.plan;p.plan=null;shoot(pl.ang,pl.pw,p);}
    }else if(p.ph==="roll"){
      const r=advanceBall(p,dt);
      if(r==="fall")p.ph="fall";
      else if(r==="hole"){
        sfxHole();
        if(!p.bot)pushRecord(S.hole,p.strokes,NET.name).then(n=>{if(n)banner("Neuer Rekord!");});
        const d=p.strokes-courses()[S.hole].par;
        simFinish(p,i,p.strokes,p.name+" im Ziel: "+p.strokes+" ("+(d>0?"+"+d:d)+")");
      }else if(r==="stop"){
        const cp=checkAt(p.pos[0],p.pos[1]);
        if(cp&&(!p.check||cp[0]!==p.check[0]||cp[1]!==p.check[1])){
          p.check=cp;if(!p.bot)banner("Checkpoint erreicht");
        }
        if(p.strokes>=maxStrokes())simFinish(p,i,maxStrokes(),p.name+": aufgegeben");
        else simReady(p,i);
      }
    }else if(p.ph==="fall"){
      p.fallV=(p.fallV||0)+9.81*dt;
      p.fallY-=p.fallV*dt;
      p.pos[0]+=p.vel[0]*dt*.4;p.pos[1]+=p.vel[1]*dt*.4;
      if(p.fallY<-2.5){
        p.fallY=undefined;p.vel=[0,0];
        p.pos=[...(p.check||S.tee)];p.strokes++;
        if(!p.bot)banner("Abgestürzt – zurück zum Checkpoint (+1)");
        updateBoard();simReady(p,i);
      }
    }
  });
  /* Eingabe richtet sich nach dem menschlichen Spieler */
  const me=S.players[0];
  if(me&&S.phase!=="between")S.phase=me.done?"between":me.ph;
}
function startHole(hi){
  S.hole=hi;buildHole(hi);S.act=0;
  S.players.forEach(p=>{p.ph="idle";p.botT=0;p.plan=null;p.shotT=0;});
  updateBoard();updateHud();
  if(SIM()){
    S.players.forEach(p=>{p.ph=p.bot?"bot":"aim";});
    S.phase="aim";
    const me=S.players[0];
    S.aim=Math.atan2(S.cup[0]-me.pos[0],S.cup[1]-me.pos[1]);
    S.camYawT=S.aim;S.power=0;
    banner("Alle starten gleichzeitig");
    updateHud();
  }else beginTurn();
}
function beginTurn(){
  const p=cur();
  S.phase=p.bot?"bot":"aim";
  S.aim=Math.atan2(S.cup[0]-p.pos[0],S.cup[1]-p.pos[1]);
  S.camYawT=S.aim;
  S.power=0;S.botPlan=null;S.botT=0;
  if(p.bot)banner(p.name+" ist dran");
  else if(S.players.length>1)banner("Du bist dran");
  updateHud();updateBoard();
}
function endTurn(){
  const p=cur();
  if(p.done||p.strokes>=maxStrokes()){
    if(!p.done){p.done=true;p.scores.push(maxStrokes());}
    // nächster Spieler
    let n=S.act+1;
    while(n<S.players.length&&S.players[n].done)n++;
    if(n<S.players.length){S.act=n;beginTurn();}
    else finishHole();
  }else{S.phase=p.bot?"bot":"aim";S.power=0;S.botPlan=null;S.botT=0;updateHud();}
}
function holeOut(){
  const p=cur();p.done=true;p.scores.push(p.strokes);sfxHole();
  if(!p.bot){
    const hi=S.hole,st=p.strokes;
    pushRecord(hi,st,NET.name).then(neu=>{if(neu)banner("Neuer Bahnrekord!");});
  }
  const d=p.strokes-courses()[S.hole].par;
  banner(p.name+": "+(p.strokes===1?"Ass!":d<0?"Birdie!":d===0?"Par":"+"+d));
  balls[S.act].visible=false;
  updateBoard();
  setTimeout(()=>{
    let n=S.act+1;while(n<S.players.length&&S.players[n].done)n++;
    if(n<S.players.length){S.act=n;beginTurn();}else finishHole();
  },900);
}
function finishHole(){
  S.phase="between";
  S.players.forEach(p=>{if(p.scores.length<=S.hole)p.scores.push(maxStrokes());});
  const rank=[...S.players].sort((a,b)=>a.scores[S.hole]-b.scores[S.hole]);
  let rows="<tr><th>Spieler</th><th>Bahn</th><th>Gesamt</th></tr>";
  for(const p of rank)rows+=`<tr class="${p.bot?"":"me"}"><td class="nm"><i style="background:${p.hex}"></i>${p.name}</td>`+
    `<td>${p.scores[S.hole]}</td><td>${fmtD(totalOf(p))}</td></tr>`;
  $("holeTable").innerHTML=rows;
  $("holeOvTitle").textContent=(S.mode==="marble"?"":"Bahn "+(S.hole+1)+" · ")+courses()[S.hole].name;
  const rc=NET.records[S.hole];
  $("holeRec").textContent=rc?("Bahnrekord: "+rc.s+" ("+rc.n+")"):"";
  setTimeout(()=>$("holeOv").classList.add("show"),650);
}
$("nextBtn").onclick=()=>{
  $("holeOv").classList.remove("show");
  if(S.hole+1<courses().length)startHole(S.hole+1);else showEnd();
};
function showEnd(){
  const rank=[...S.players].sort((a,b)=>totalOf(a)-totalOf(b));
  let rows="<tr><th>#</th><th>Spieler</th><th>Schläge</th><th>Ges.</th></tr>";
  rank.forEach((p,i)=>{
    const tot=p.scores.reduce((a,b)=>a+b,0);
    rows+=`<tr class="${p.bot?"":"me"}"><td>${i+1}</td><td class="nm"><i style="background:${p.hex}"></i>${p.name}</td>`+
      `<td>${tot}</td><td><b>${fmtD(totalOf(p))}</b></td></tr>`;
  });
  $("scoreTable").innerHTML=rows;
  const me=S.players[0],pos=rank.indexOf(me)+1,par=courses().reduce((a,c)=>a+c.par,0);
  $("endTitle").textContent=S.players.length===1?"🏁 Runde beendet":(pos===1?"🏆 Gewonnen!":"🏁 Runde beendet");
  $("endScore").textContent=fmtD(totalOf(me))+" ("+me.scores.reduce((a,b)=>a+b,0)+" Schläge)";
  $("endSub").textContent=S.players.length===1?("Par der Anlage: "+par):
    (pos===1?"Du hast das Feld hinter dir gelassen!":"Sieger: "+rank[0].name+" mit "+fmtD(totalOf(rank[0])));
  $("endOv").classList.add("show");
  /* Ergebnis melden und Weltbestenliste nachladen */
  $("netMsg").textContent="Bestenliste wird geladen …";
  $("worldTable").innerHTML="";
  (async()=>{
    const tot=me.scores.reduce((a,b)=>a+b,0);
    await pushRound(NET.name,tot,totalOf(me));
    const top=await loadBoard();
    if(!top||!top.length){
      $("netMsg").textContent=NET.ok===false
        ?"Bestenliste nicht erreichbar – dein Ergebnis wurde lokal gewertet."
        :"Noch keine Einträge.";
      return;
    }
    let rows="<tr><th>#</th><th>Spieler</th><th>Schläge</th><th>Ges.</th></tr>";
    top.forEach((e,i)=>{
      const mine=(e.n===NET.name&&e.s===tot);
      rows+=`<tr class="${mine?"me":""}"><td>${i+1}</td><td class="nm">${String(e.n||"?").slice(0,14)}</td>`+
        `<td>${e.s}</td><td><b>${fmtD(e.d)}</b></td></tr>`;
    });
    $("worldTable").innerHTML=rows;
    $("netMsg").textContent="";
  })();
}
let bT=null;
function banner(t){const b=$("banner");b.textContent=t;b.classList.add("show");
  clearTimeout(bT);bT=setTimeout(()=>b.classList.remove("show"),1500);}
function updateBoard(){
  if(S.players.length<2){$("board").style.display="none";return;}
  $("board").style.display="block";
  const rank=[...S.players].sort((a,b)=>totalOf(a)-totalOf(b));
  $("board").innerHTML=rank.map(p=>{
    const act=S.players.indexOf(p)===S.act;
    return `<div class="brow${act?" act":""}"><i style="background:${p.hex}"></i><b>${p.name}</b>`+
      `<span>${fmtD(totalOf(p))}</span></div>`;
  }).join("");
}
function updateHud(){
  const c=courses()[S.hole],p=cur();
  $("holeSub").textContent="Bahn "+(S.hole+1)+" · "+c.name;
  $("parInfo").textContent="Par "+c.par;
  $("whoInfo").textContent=p.bot?p.name:"Du";
  $("strokeInfo").textContent=p.strokes+" Schläge";
  $("totInfo").textContent=fmtD(totalOf(S.players[0]));
  $("hint").style.opacity=(S.phase==="aim"&&S.hole===0&&p.strokes===0)?"1":"0";
}

/* ═══════════ Eingabe ═══════════ */
const dom=renderer.domElement;
function ballScreen(){
  const p=cur().pos;
  const v=new THREE.Vector3(p[0],hAt(p[0],p[1])+R,p[1]).project(camera);
  return [(v.x*.5+.5)*innerWidth,(-v.y*.5+.5)*innerHeight];
}
dom.addEventListener("pointerdown",e=>{
  if(S.phase!=="aim")return;
  const bs=ballScreen();
  const grab=Math.max(60,Math.min(innerWidth,innerHeight)*.16);
  if(Math.hypot(e.clientX-bs[0],e.clientY-bs[1])>grab)return; // nur am Ball greifen
  S.drag={x:e.clientX,y:e.clientY};
  $("power").style.display="block";
});
dom.addEventListener("pointermove",e=>{
  if(!S.drag||S.phase!=="aim")return;
  /* Schleuder: Zugrichtung umkehren, Stärke = Zuglänge */
  const ux=S.drag.x-e.clientX, uy=S.drag.y-e.clientY;
  const len=Math.hypot(ux,uy);
  if(len<8){S.power=0;$("powerFill").style.width="0%";return;}
  const maxPx=Math.min(innerWidth,innerHeight)*.38;
  S.power=Math.min(1,len/maxPx);
  /* Bildschirmrichtung in Weltrichtung umrechnen (hoch = von der Kamera weg) */
  const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();
  const r=new THREE.Vector3(-f.z,0,f.x);
  const w=new THREE.Vector3().addScaledVector(f,-uy/len).addScaledVector(r,ux/len);
  S.aim=Math.atan2(w.x,w.z);
  $("powerFill").style.width=(S.power*100)+"%";
});
addEventListener("pointerup",()=>{
  if(!S.drag)return;S.drag=null;$("power").style.display="none";
  if(S.phase!=="aim")return;
  if(S.power>.06)shoot(S.aim,S.power);
  S.power=0;
});
$("rotL").onclick=()=>S.camYawT-=Math.PI/4;
$("rotR").onclick=()=>S.camYawT+=Math.PI/4;

function shoot(ang,pw,who){
  const p=who||cur();p.strokes++;sfxHit(pw);
  const sp=pw*MAXSPD;
  p.vel=[Math.sin(ang)*sp,Math.cos(ang)*sp];
  p.ph="roll";p.shotT=0;
  if(p===cur()){S.phase="roll";S.shotT=0;}
  updateHud();updateBoard();
}

/* ═══════════ Bot ═══════════ */
function pathScore(pos){
  const gx=Math.round(pos[0]-S.ox),gz=Math.round(pos[1]-S.oz);
  const d=(S.D[gz]&&S.D[gz][gx]!==undefined)?S.D[gz][gx]:999;
  return d+Math.hypot(pos[0]-S.cup[0],pos[1]-S.cup[1])*.12;
}
function botThink(p){
  let best=null;const cands=[];
  const base=Math.atan2(S.cup[0]-p.pos[0],S.cup[1]-p.pos[1]);
  for(let a=0;a<64;a++){
    const ang=base+(a/64)*Math.PI*2;
    for(let pw=.22;pw<=1.001;pw+=.13){
      const sp=pw*MAXSPD;
      const r=simulate(p.pos,[Math.sin(ang)*sp,Math.cos(ang)*sp],null,S.millA+MILL_W*.6);
      let sc=pathScore(r.pos);
      if(r.holed)sc=-10+pw*.5;
      cands.push({ang,pw,sc});
    }
  }
  cands.sort((a,b)=>a.sc-b.sc);
  const pick=cands[Math.min(cands.length-1,(Math.random()*(1+p.skill.slop))|0)];
  const g=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
  return {ang:pick.ang+g()*p.skill.ang, pw:Math.max(.08,Math.min(1,pick.pw*(1+g()*p.skill.pow)))};
}

/* ═══════════ Kamera ═══════════ */
function updateCam(dt){
  const p=cur();
  S.camYaw+=(S.camYawT-S.camYaw)*Math.min(1,dt*6);
  const back=3.1, hgt=1.85, ahead=2.6;
  const cx=p.pos[0]-Math.sin(S.camYaw)*back, cz=p.pos[1]-Math.cos(S.camYaw)*back;
  /* Kamera folgt der Streckenhöhe, damit sie auf oberen Ebenen nicht im Boden steckt */
  const cy=hgt+Math.max(hAt(p.pos[0],p.pos[1]),hAt(cx,cz))-TOP;
  camera.position.lerp(new THREE.Vector3(cx,cy,cz),Math.min(1,dt*4.2));
  const ax=p.pos[0]+Math.sin(S.camYaw)*ahead, az=p.pos[1]+Math.cos(S.camYaw)*ahead;
  camera.lookAt(ax,hAt(ax,az),az);
  sun.position.set(p.pos[0]+5,11,p.pos[1]+4);sun.target.position.set(p.pos[0],0,p.pos[1]);
  /* Steht die Mühle zwischen Kamera und Ball, wird sie fast durchsichtig –
     sonst verdecken die Flügel den Ball. */
  if(S.millCell){
    const mx=S.millCell[0],mz=S.millCell[1];
    const vx=p.pos[0]-cx, vz=p.pos[1]-cz;
    const len2=vx*vx+vz*vz||1;
    const t=Math.max(0,Math.min(1,((mx-cx)*vx+(mz-cz)*vz)/len2));
    const qx=cx+t*vx, qz=cz+t*vz;
    const off=Math.hypot(mx-qx,mz-qz);
    const blocking=(t>.03&&t<1.02&&off<1.15);
    const target=blocking?.10:1;                     /* 90 % durchsichtig */
    millFade+=(target-millFade)*Math.min(1,dt*7);
    MILLMAT.opacity=millFade;
    MILLMAT.depthWrite=millFade>.95;
    if(mill)mill.castShadow=millFade>.5;
    if(millBody)millBody.castShadow=millFade>.5;
  }
  faceSprites(S.camYaw);
}

/* ═══════════ Zielhilfe ═══════════ */
function updateGuide(){
  /* Im Simultanmodus zaehlt der Zustand des menschlichen Spielers, nicht die
     globale Phase – die spiegelt dort nur mit. */
  const me=SIM()?S.players[0]:null;
  const show=SIM()
    ? (!!me&&!me.done&&me.ph==="aim")
    : (S.phase==="aim"&&!cur().bot);
  guide.visible=show;ring.visible=show;
  if(!show)return;
  const p=cur().pos;
  ring.position.set(p[0],hAt(p[0],p[1])+.006,p[1]);
  const pos=[p[0],p[1]];const vel=[Math.sin(S.aim),Math.cos(S.aim)];
  const pts=[];let travelled=0;
  const maxLen=.7+S.power*2.4, dt=.016;
  let mA=S.millA;
  while(travelled<maxLen&&pts.length<62){
    pos[0]+=vel[0]*dt;pos[1]+=vel[1]*dt;travelled+=dt;mA+=MILL_W*dt;
    collide(pos,vel,R,mA);
    const l=Math.hypot(vel[0],vel[1])||1;vel[0]/=l;vel[1]/=l;
    pts.push(pos[0],0,pos[1]);
  }
  /* Band aufspannen: je Stützpunkt zwei Ecken quer zur Laufrichtung */
  const n=Math.max(2,(pts.length/3)|0);
  const arr=guideGeo.attributes.position.array;
  for(let i=0;i<GUIDE_N;i++){
    const j=Math.min(n-1,i);
    const jn=Math.min(n-1,j+1), jp=Math.max(0,j-1);
    let dx=pts[jn*3]-pts[jp*3], dz=pts[jn*3+2]-pts[jp*3+2];
    const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    const x=pts[j*3], z=pts[j*3+2];
    const nx=-dz*GUIDE_W, nz=dx*GUIDE_W;
    const y=hAt(x,z)+.014;
    arr[i*6  ]=x+nx;arr[i*6+1]=y;arr[i*6+2]=z+nz;
    arr[i*6+3]=x-nx;arr[i*6+4]=y;arr[i*6+5]=z-nz;
  }
  guideGeo.attributes.position.needsUpdate=true;
}

/* ═══════════ Schleife ═══════════ */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;S.t+=dt;
  S.millA+=dt*MILL_W;
  if(mill)mill.rotation.z=S.millA;

  if(S.players.length&&SIM()&&S.phase!=="between"){
    stepSim(dt);
  }
  else if(S.players.length){
    const p=cur();
    if(S.phase==="bot"){
      S.botT+=dt;
      if(!S.botPlan&&S.botT>.35)S.botPlan=botThink(p);
      if(S.botPlan&&S.botT>.95){S.aim=S.botPlan.ang;shoot(S.botPlan.ang,S.botPlan.pw);}
    }
    if(S.phase==="roll"){
      S.shotT+=dt;
      let sub=Math.ceil(dt/(1/240));sub=Math.min(sub,24);
      const h=dt/sub;
      for(let i=0;i<sub;i++){
        /* Hangkraft aus dem Höhenfeld, danach Rollreibung */
        let pull=0;
        if(S.hgrid){
          const gr=gradAt(p.pos[0],p.pos[1]);
          p.vel[0]-=GRAV*gr[0]*h;p.vel[1]-=GRAV*gr[1]*h;
          pull=GRAV*Math.hypot(gr[0],gr[1]);
        }
        const sp=Math.hypot(p.vel[0],p.vel[1]);
        if(sp>.012||pull>DEC){
          if(sp>1e-9){
            const nsp=Math.max(0,sp-DEC*h);
            p.vel[0]=p.vel[0]/sp*nsp;p.vel[1]=p.vel[1]/sp*nsp;
          }
          p.pos[0]+=p.vel[0]*h;p.pos[1]+=p.vel[1]*h;
          if(collide(p.pos,p.vel,R,S.millA)&&sp>.35&&S.t-S.lastBounce>.06){
            S.lastBounce=S.t;sfxBounce(sp);
          }
        }else{p.vel[0]=p.vel[1]=0;}
        /* Von der Strecke gefallen? */
        if(S.hgrid&&!onTrack(p.pos[0],p.pos[1])){
          p.fallY=hAt(p.pos[0],p.pos[1]);p.fallV=0;
          S.phase="fall";break;
        }
        const dh=Math.hypot(p.pos[0]-S.cup[0],p.pos[1]-S.cup[1]);
        if(dh<HOLE_R&&Math.hypot(p.vel[0],p.vel[1])<HOLE_V){
          p.vel=[0,0];p.pos=[S.cup[0],S.cup[1]];S.phase="between";holeOut();break;
        }
      }
      if(S.phase==="roll"&&Math.hypot(p.vel[0],p.vel[1])<=.012){
        /* Checkpoint merken, wenn der Ball dort zum Liegen kommt */
        const cp=checkAt(p.pos[0],p.pos[1]);
        if(cp&&(!p.check||cp[0]!==p.check[0]||cp[1]!==p.check[1])){
          p.check=cp;banner("Checkpoint erreicht");
        }
      }
      if(S.phase==="roll"&&Math.hypot(p.vel[0],p.vel[1])<=.012){
        if(p.strokes>=maxStrokes()){p.done=true;p.scores.push(maxStrokes());
          banner(p.name+": aufgegeben");balls[S.act].visible=false;
          S.phase="between";
          setTimeout(()=>{let n=S.act+1;while(n<S.players.length&&S.players[n].done)n++;
            if(n<S.players.length){S.act=n;beginTurn();}else finishHole();},700);
        }else{
          S.phase=p.bot?"bot":"aim";S.botT=0;S.botPlan=null;
          S.aim=Math.atan2(S.cup[0]-p.pos[0],S.cup[1]-p.pos[1]);
          S.camYawT=S.aim;updateHud();
        }
      }
    }
    else if(S.phase==="fall"){
      p.fallV=(p.fallV||0)+9.81*dt;
      p.fallY-=p.fallV*dt;
      p.pos[0]+=p.vel[0]*dt*.4;p.pos[1]+=p.vel[1]*dt*.4;
      if(p.fallY<-2.5){
        p.fallY=undefined;p.vel=[0,0];
        p.pos=[...(p.check||S.tee)];
        p.strokes++;                       /* Strafschlag */
        banner("Abgestürzt – zurück zum Checkpoint (+1)");
        S.phase=p.bot?"bot":"aim";S.botT=0;S.botPlan=null;
        S.aim=Math.atan2(S.cup[0]-p.pos[0],S.cup[1]-p.pos[1]);
        S.camYawT=S.aim;updateHud();updateBoard();
      }
    }
  }
  /* Bälle zeichnen – gilt für beide Spielweisen */
  if(S.players.length){
    S.players.forEach((pl,i)=>{
      if(!balls[i])return;
      balls[i].position.set(pl.pos[0],(pl.fallY!==undefined?pl.fallY:hAt(pl.pos[0],pl.pos[1]))+R,pl.pos[1]);
      const rolling=SIM()?(pl.ph==="roll"):(i===S.act&&S.phase==="roll");
      if(rolling){
        balls[i].rotation.x-=pl.vel[1]*dt/R*.5;
        balls[i].rotation.z+=pl.vel[0]*dt/R*.5;
      }
    });
    updateCam(dt);updateGuide();
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ═══════════ Start ═══════════ */
buildSlices();
wallStyle();
buildMillCoverage();
buildSetup();
$("sndBtn").onclick=audioToggle;
S.mode="golf";
function pickMode(m){
  S.mode=m;
  $("modeGolf").classList.toggle("sel",m==="golf");
  $("modeMarble").classList.toggle("sel",m==="marble");
}
$("modeGolf").onclick=()=>pickMode("golf");
$("modeMarble").onclick=()=>pickMode("marble");
$("startBtn").onclick=()=>{
  const v=($("nameIn").value||"").trim();
  NET.name=(v||"Spieler").slice(0,14);
  $("startOv").classList.remove("show");
  musicStart();
  loadRecords();
  makePlayers();startHole(0);
};
requestAnimationFrame(loop);
</script>
